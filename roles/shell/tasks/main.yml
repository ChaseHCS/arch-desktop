---
- name: Install zsh and plugins
  community.general.pacman:
    name: "{{ shell_packages }}"
    state: present

# Cloned rather than piping install.sh into sh. Oh My Zsh updates itself
# afterwards (`omz update`), so the playbook doesn't pull on re-runs.
- name: Install Oh My Zsh
  ansible.builtin.git:
    repo: "{{ shell_omz_repo }}"
    dest: "{{ desktop_home }}/.oh-my-zsh"
    version: master
    depth: 1
    update: false
  become: true
  become_user: "{{ desktop_user }}"

- name: Write .zshrc
  ansible.builtin.template:
    src: zshrc.j2
    dest: "{{ desktop_home }}/.zshrc"
    mode: "0644"
    force: "{{ dotfiles_overwrite }}"
    backup: true
  become: true
  become_user: "{{ desktop_user }}"

- name: Make zsh the login shell
  ansible.builtin.user:
    name: "{{ desktop_user }}"
    shell: /usr/bin/zsh
