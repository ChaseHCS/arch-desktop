---
# LazyVim needs Neovim >= 0.11.2, git, a C compiler (base-devel) and the
# tree-sitter CLI; the rest are used by its pickers and integrations.
neovim_packages:
  - neovim
  - tree-sitter-cli
  - lazygit
  - ripgrep
  - fd
  - fzf
  - wl-clipboard
  - unzip
  - python-pynvim

neovim_starter_repo: https://github.com/LazyVim/starter.git
# Install plugins headlessly right after cloning the starter, so the first
# launch is quick. Mason LSP servers still install on first open.
neovim_bootstrap_plugins: true
