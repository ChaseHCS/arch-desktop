---
- name: Install SDDM
  community.general.pacman:
    name: "{{ sddm_packages }}"
    state: present

# Earlier versions of this playbook installed sddm-astronaut-theme.
- name: Remove sddm-astronaut-theme
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/share/sddm/themes/sddm-astronaut-theme
    - /usr/share/fonts/sddm-astronaut-theme
  notify: Refresh font cache

- name: Install your login screen theme
  when: sddm_theme | length > 0
  block:
    - name: Check that the theme exists in the repo
      ansible.builtin.assert:
        that: (sddm_themes_src ~ '/' ~ sddm_theme ~ '/metadata.desktop') is file
        fail_msg: >-
          sddm_theme is "{{ sddm_theme }}" but {{ sddm_themes_src }}/{{ sddm_theme }}/metadata.desktop
          doesn't exist. See sddm-themes/README.md.
        quiet: true

    # Without QtVersion=6, SDDM looks for the Qt 5 greeter, which Arch doesn't
    # ship, and silently falls back to its built-in theme.
    - name: Check that the theme targets the Qt 6 greeter
      ansible.builtin.assert:
        that: >-
          lookup('ansible.builtin.ini', 'QtVersion', section='SddmGreeterTheme',
          file=sddm_themes_src ~ '/' ~ sddm_theme ~ '/metadata.desktop', default='5') | string == '6'
        fail_msg: Add QtVersion=6 to the [SddmGreeterTheme] section of metadata.desktop.
        quiet: true

    # Copied rather than symlinked: the sddm user can't read your home directory.
    - name: Copy the theme to /usr/share/sddm/themes
      ansible.builtin.copy:
        src: "{{ sddm_themes_src }}/{{ sddm_theme }}/"
        dest: "/usr/share/sddm/themes/{{ sddm_theme }}/"
        owner: root
        group: root
        mode: "u=rwX,go=rX"
        directory_mode: "0755"

- name: Ensure the SDDM config directory exists
  ansible.builtin.file:
    path: /etc/sddm.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure SDDM
  ansible.builtin.template:
    src: sddm.conf.j2
    dest: /etc/sddm.conf.d/10-arch-desktop.conf
    owner: root
    group: root
    mode: "0644"

# Arch's /etc/pam.d/sddm normally already has these lines. They're only added
# if missing, so pacman doesn't start leaving .pacnew files around.
- name: Check that SDDM unlocks the keyring at login
  ansible.builtin.command:
    argv: [grep, -q, pam_gnome_keyring.so, /etc/pam.d/sddm]
  register: sddm_pam_keyring
  changed_when: false
  failed_when: sddm_pam_keyring.rc > 1
  check_mode: false

- name: Unlock the GNOME keyring with the login password
  ansible.builtin.lineinfile:
    path: /etc/pam.d/sddm
    line: "{{ item.line }}"
    insertafter: "{{ item.after }}"
  loop:
    - { after: '^auth\s+include\s+system-login', line: "-auth       optional    pam_gnome_keyring.so" }
    - { after: '^password\s+include\s+system-login', line: "-password   optional    pam_gnome_keyring.so use_authtok" }
    - { after: '^session\s+include\s+system-login', line: "-session    optional    pam_gnome_keyring.so auto_start" }
  loop_control:
    label: "{{ item.line }}"
  when: sddm_pam_keyring.rc == 1

# Enabled only; starting it mid-run would switch the VT to the login screen.
# force replaces whichever display manager currently owns display-manager.service.
- name: Enable SDDM at boot
  ansible.builtin.systemd_service:
    name: sddm.service
    enabled: true
    force: true
