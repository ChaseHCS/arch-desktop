---
- name: Install Terminator and tmux
  community.general.pacman:
    name: "{{ terminal_packages }}"
    state: present

- name: Create config directories
  ansible.builtin.file:
    path: "{{ desktop_home }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ terminal_templates | map(attribute='dest') | map('dirname') | unique }}"
  become: true
  become_user: "{{ desktop_user }}"

- name: Write Terminator and tmux configs
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ desktop_home }}/{{ item.dest }}"
    mode: "0644"
    force: "{{ dotfiles_overwrite }}"
    backup: true
  loop: "{{ terminal_templates }}"
  loop_control:
    label: "{{ item.dest }}"
  become: true
  become_user: "{{ desktop_user }}"
