---
- name: Apply hardening sysctls
  ansible.builtin.template:
    src: sysctl-hardening.conf.j2
    dest: /etc/sysctl.d/90-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply sysctl settings

- name: Block rarely used network protocol modules
  ansible.builtin.template:
    src: modprobe-blacklist.conf.j2
    dest: /etc/modprobe.d/hardening-blacklist.conf
    owner: root
    group: root
    mode: "0644"

- name: Make sure sshd reads drop-in configs
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
  notify: Reload sshd

- name: Ensure the sshd drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Harden sshd
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sshd

- name: Set sshd state
  ansible.builtin.systemd_service:
    name: sshd.service
    enabled: "{{ sshd_enabled | bool }}"
    state: "{{ 'started' if sshd_enabled | bool else 'stopped' }}"

- name: Ensure the persistent faillock directory exists
  ansible.builtin.file:
    path: "{{ hardening_faillock.dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# pam_faillock creates a user's tally file on the first failure, owned by the
# user (mode 0660) so unprivileged lock screens can update it. hyprlock can't
# create it in this root-owned directory, though, so until a login or sudo
# prompt had failed once, lock-screen failures weren't counted. Create it up
# front the same way pam_faillock would.
- name: Create the desktop user's faillock tally file
  ansible.builtin.file:
    path: "{{ hardening_faillock.dir }}/{{ desktop_user }}"
    state: touch
    owner: "{{ desktop_user }}"
    group: root
    mode: "0660"
    modification_time: preserve
    access_time: preserve

- name: Configure account lockout (pam_faillock)
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: '^#?\s*{{ item.key }}\s*='
    line: "{{ item.key }} = {{ item.value }}"
  loop: "{{ hardening_faillock | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# `su -` / `su -l` use their own PAM service (su-l), so both files need it.
- name: Find su's PAM files
  ansible.builtin.stat:
    path: "/etc/pam.d/{{ item }}"
  loop: [su, su-l]
  register: hardening_su_pam

- name: Restrict su and su - to members of wheel
  ansible.builtin.lineinfile:
    path: "{{ item.stat.path }}"
    regexp: '^#?\s*auth\s+required\s+pam_wheel\.so\s+use_uid'
    line: "auth            required        pam_wheel.so use_uid"
  loop: "{{ hardening_su_pam.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.stat.path }}"
