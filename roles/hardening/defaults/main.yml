---
hardening_sysctl:
  # Kernel info leaks
  kernel.kptr_restrict: 2
  kernel.dmesg_restrict: 1
  # Attack surface
  kernel.kexec_load_disabled: 1
  kernel.unprivileged_bpf_disabled: 1
  net.core.bpf_jit_harden: 2
  dev.tty.ldisc_autoload: 0
  vm.unprivileged_userfaultfd: 0
  # Only allow ptrace on your own child processes. `gdb ./prog` still works;
  # attaching to a running process (`gdb -p`) needs sudo.
  kernel.yama.ptrace_scope: 1
  # Filesystem
  fs.protected_fifos: 2
  fs.protected_regular: 2
  fs.suid_dumpable: 0
  net.ipv4.tcp_syncookies: 1
  net.ipv4.tcp_rfc1337: 1

# Per-interface network settings, written for `all`, `default` and every
# interface (`*`). The glob matters: systemd's 50-default.conf sets
# rp_filter=2 on each interface as it appears, and the kernel uses the higher
# of `all` and the interface value, so `all` alone would leave filtering loose.
# If a VPN with policy routing misbehaves, set rp_filter to 2 (loose).
hardening_sysctl_interfaces:
  ipv4:
    rp_filter: 1
    accept_redirects: 0
    secure_redirects: 0
    send_redirects: 0
    accept_source_route: 0
  ipv6:
    accept_redirects: 0
    accept_source_route: 0

# Rarely used network protocols with a history of kernel CVEs.
hardening_blacklisted_modules:
  - dccp
  - rds
  - tipc

# pam_faillock: lock an account for unlock_time seconds after `deny` failures
# within fail_interval seconds. Applies to the login screen, sudo and hyprlock.
# Stored under /var/lib so lockouts survive a reboot.
hardening_faillock:
  deny: 5
  fail_interval: 900
  unlock_time: 600
  dir: /var/lib/faillock
