# Portal backends for the Hyprland session, written by the arch-desktop playbook.
# Hyprland's portal handles screen sharing/screenshots; KDE's provides the
# file picker and the dark/light setting, so dialogs match Dolphin and the
# rest of the Breeze Dark theme.
[preferred]
default=hyprland;kde
org.freedesktop.impl.portal.FileChooser=kde
