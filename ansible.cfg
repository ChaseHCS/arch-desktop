[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False
nocows = True
# Run notified handlers (initramfs, dconf, ...) even if a later task fails.
force_handlers = True

[privilege_escalation]
# Prompt for the sudo password once at start-up, so -K isn't needed.
become_ask_pass = True
