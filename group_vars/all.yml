---
# Main knobs for the desktop. Everything here can also be overridden on the
# command line, e.g. `./bootstrap.sh -e gpu_vendor=amd`. `-e key=value` always
# passes a string; use JSON for booleans, numbers and lists, e.g.
# `-e '{"enable_docker": false, "extra_packages": ["htop"]}'`.

# --- User -------------------------------------------------------------------
# The account the desktop is set up for. Defaults to whoever launched the
# playbook; SUDO_USER is only used if it was started as root.
desktop_user: >-
  {{ lookup('env', 'USER') if lookup('env', 'USER') not in ['', 'root']
     else lookup('env', 'SUDO_USER') }}

# Dotfiles (zshrc, hyprland.lua, tmux.conf, ...) are only written when missing,
# so re-running the playbook never clobbers your edits. Set to true to force a
# re-render; the previous file is kept as a timestamped backup next to it.
dotfiles_overwrite: false

# --- Packages ---------------------------------------------------------------
# Run `pacman -Syu` before installing anything (Arch doesn't support partial
# upgrades, so leave this on unless you know why you're turning it off).
pacman_full_upgrade: true
pacman_parallel_downloads: 5

# Extra packages from the official repos / the AUR.
extra_packages: []
aur_packages: []

# --- GPU --------------------------------------------------------------------
# nvidia | amd | intel | none
gpu_vendor: nvidia
# nvidia-open-dkms supports Turing (RTX 20 / GTX 16) and newer. Pascal (GTX 10)
# and older are no longer supported by the 590+ driver; those cards need the
# AUR nvidia-580xx-* packages instead, which this playbook doesn't manage.
nvidia_driver_package: nvidia-open-dkms
# Put the NVIDIA modules in the initramfs (early KMS).
nvidia_early_kms: true

# --- Desktop ----------------------------------------------------------------
# Hyprland is the only session. KDE apps (Dolphin, Okular, Ark, Gwenview) and
# GTK apps are themed Breeze Dark to match.
browsers:
  - firefox
  - chromium
enable_bluetooth: false

# --- Login screen (SDDM) ----------------------------------------------------
# Name of your theme directory under sddm-themes/ in this repo; it's copied to
# /usr/share/sddm/themes/<name>. Empty means SDDM's built-in theme.
# Qt modules your theme imports beyond QtQuick (e.g. qt6-svg,
# qt6-multimedia-ffmpeg) go in extra_packages.
sddm_theme: ""

# --- Hyprland ---------------------------------------------------------------
hypr_terminal: terminator
hypr_file_manager: dolphin
hypr_menu: fuzzel
hypr_browser: firefox
hypr_kb_layout: us
hypr_kb_variant: ""
hypr_kb_options: ""
# One entry per monitor. The default rule picks the preferred mode for any
# connected display. Example for a specific output:
#   - { output: DP-1, mode: "2560x1440@165", position: "0x0", scale: "1" }
hypr_monitors:
  - { output: "", mode: preferred, position: auto, scale: auto }
# Idle timers (seconds): lock the session, then turn displays off.
hypr_idle_lock_after: 600
hypr_idle_dpms_after: 900

# --- Shell / terminal -------------------------------------------------------
zsh_theme: robbyrussell
omz_plugins:
  - git
  - sudo
  - fzf
  - tmux
  - python
  - uv
  - fnm
  - docker
  - docker-compose
terminal_font: "JetBrainsMono Nerd Font"
terminal_font_size: 11

# --- Neovim -----------------------------------------------------------------
# LazyVim extras enabled on first install (written to lazyvim.json only if
# that file doesn't exist yet; manage them later with :LazyExtras).
lazyvim_extras:
  - lazyvim.plugins.extras.lang.python
  - lazyvim.plugins.extras.lang.typescript
  - lazyvim.plugins.extras.lang.json
  - lazyvim.plugins.extras.lang.yaml
  - lazyvim.plugins.extras.lang.toml
  - lazyvim.plugins.extras.lang.markdown
  - lazyvim.plugins.extras.lang.docker
  - lazyvim.plugins.extras.lang.ansible

# --- Dev toolchains ---------------------------------------------------------
enable_python: true
enable_nodejs: true
enable_docker: true
# Membership of the docker group is equivalent to root. Set to false to use
# `sudo docker` (or set up rootless Docker yourself).
docker_user_in_group: true

# --- Peripherals ------------------------------------------------------------
# Logitech G mice (G HUB replacement): Piper for DPI, buttons, lighting and
# profiles (saved on the mouse), Solaar for receiver pairing and battery.
enable_logitech: true
# Keep Solaar running in the tray for battery status. Off by default: Solaar
# re-applies the settings it remembers whenever the mouse reconnects, which can
# undo changes made in Piper. If you turn this on, mark DPI, report rate and
# onboard profiles as ignored in Solaar (the icon next to each setting).
logitech_solaar_tray: false

# --- Music ------------------------------------------------------------------
# Spotify's official client (spotify-launcher) and spotify-player (terminal).
enable_spotify: true
# Optional client ID of your own Spotify app, for spotify-player. Create one at
# https://developer.spotify.com/dashboard with redirect URI
# http://127.0.0.1:8989/login. Without it, spotify-player uses ncspot's shared
# client ID, which can hit rate limits. It's a public identifier; never put the
# app's client *secret* here (PKCE login doesn't need one).
spotify_client_id: ""

# --- Firewall ---------------------------------------------------------------
# nftables: incoming connections are dropped unless listed here; outgoing
# traffic is unrestricted. sshd's port opens automatically if sshd_enabled.
enable_firewall: true
# e.g. firewall_allowed_udp_ports: [57621] for Spotify Connect discovery by
# devices not signed in to your account (your own devices don't need it).
firewall_allowed_tcp_ports: []
firewall_allowed_udp_ports: []
# Let Docker containers reach services on the host (e.g. a local database).
# Ports published with `-p` bypass this firewall entirely (Docker routes them
# itself), so bind them to localhost (-p 127.0.0.1:8080:80) unless you mean
# to expose them to the network.
firewall_trust_docker_bridges: true

# --- Hardening --------------------------------------------------------------
enable_hardening: true
# Keep sshd disabled. The hardened sshd drop-in is written either way.
sshd_enabled: false
