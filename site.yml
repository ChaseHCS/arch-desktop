---
- name: Configure an Arch Linux coding desktop
  hosts: localhost
  become: true

  pre_tasks:
    - name: Ensure this is Arch Linux
      ansible.builtin.assert:
        that: ansible_facts['distribution'] == 'Archlinux'
        fail_msg: This playbook only supports Arch Linux.
        quiet: true
      tags: [always]

    # The AUR role's temporary passwordless-pacman rule is normally removed in
    # an always: block, which doesn't run if the play is interrupted (Ctrl-C,
    # crash, power loss). Clean up on every run, whatever the tags.
    - name: Remove a leftover temporary sudoers rule
      ansible.builtin.file:
        path: /etc/sudoers.d/99-ansible-aur
        state: absent
      tags: [always]

    - name: Ensure the desktop user is a regular account
      ansible.builtin.assert:
        that:
          - desktop_user | length > 0
          - desktop_user != 'root'
        fail_msg: >-
          Run the playbook as your normal user (it asks for the sudo password),
          or pass -e desktop_user=<name>.
        quiet: true
      tags: [always]

    - name: Look up the desktop user's account
      ansible.builtin.getent:
        database: passwd
        key: "{{ desktop_user }}"
      tags: [always]

    - name: Record the desktop user's home directory
      ansible.builtin.set_fact:
        desktop_home: "{{ ansible_facts['getent_passwd'][desktop_user][4] }}"
      tags: [always]

    - name: Check whether the initramfs is built by mkinitcpio
      ansible.builtin.stat:
        path: /usr/bin/mkinitcpio
      register: mkinitcpio_bin
      tags: [always]

  roles:
    - { role: base, tags: [base] }
    - { role: aur, tags: [aur] }
    - { role: gpu, tags: [gpu] }
    - { role: desktop, tags: [desktop] }
    - { role: sddm, tags: [sddm] }
    - { role: hyprland, tags: [hyprland] }
    - { role: shell, tags: [shell] }
    - { role: terminal, tags: [terminal] }
    - { role: neovim, tags: [neovim] }
    - { role: dev, tags: [dev] }
    - { role: peripherals, tags: [peripherals] }
    - { role: music, tags: [music], when: enable_spotify | bool }
    - { role: firewall, tags: [firewall], when: enable_firewall | bool }
    - { role: hardening, tags: [hardening], when: enable_hardening | bool }

  handlers:
    - name: Rebuild initramfs
      ansible.builtin.command: mkinitcpio -P
      when: mkinitcpio_bin.stat.exists
      changed_when: true

    - name: Apply sysctl settings
      ansible.builtin.systemd_service:
        name: systemd-sysctl.service
        state: restarted

  post_tasks:
    - name: Done
      ansible.builtin.debug:
        msg: >-
          Finished. Reboot to load the new kernel modules and start SDDM, then log in
          to Hyprland.
      tags: [always]
